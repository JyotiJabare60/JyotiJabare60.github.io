# Builds the static site and publishes it to GitHub Pages.
# The site URL is taken from the Pages configuration, so nothing is hard-coded:
# it works for both <username>.github.io and a project repo served from a subpath.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # sets NUXT_APP_BASE_URL automatically, so a project-subpath repo works too
          static_site_generator: nuxt

      - run: npm ci

      - name: Generate static site
        env:
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run generate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
